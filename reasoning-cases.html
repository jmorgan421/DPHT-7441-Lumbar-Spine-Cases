<body>
<div class="wrap">
<header>
  <div class="kick">DPHT 7441 &nbsp;|&nbsp; Module 5 &nbsp;|&nbsp; Lumbar Spine and SIJ</div>
  <h1 id="h1">Reasoning Cases</h1>
  <div class="sub" id="hsub">Work a case from presentation to outcome measure. Your written answers are yours; your selections are scored at the end.</div>
</header>
<div class="bar" id="bar"></div>
<main id="stage" aria-live="polite"></main>
<footer>Nothing is saved, submitted, or graded. This is practice for you.</footer>
</div>

<script>
const CASES = [
{
  id:"stenosis", name:"Case 1 — Margaret, 71",
  hyp_key:{
    most:{ name:"Lumbar spinal stenosis with neurogenic claudication",
      keys:["stenosis","claudication","canal"],
      why:"At 71 with back AND leg symptoms that have progressed over eight months and are taking activities away, stenosis is the condition the referral points at most strongly. Age alone moves it up the list." },
    less:[
      { name:"Lumbar radiculopathy", why:"Leg symptoms keep a nerve root on the list, though a slow eight-month progression without a clear event makes a disc less likely than it would be in a younger patient." },
      { name:"Hip osteoarthritis", why:"At 71, leg and buttock symptoms that limit walking can come from the hip. Worth carrying until the examination separates it." } ],
    remote:[
      { name:"Vascular claudication", why:"Walking-limited leg symptoms in a 71-year-old always need vascular claudication excluded, even when stenosis is the better fit. It is the one that is easy to forget and costly to miss." },
      { name:"Compression fracture or malignancy", why:"Age over 50 is a screening trigger on its own. A progressive course in an older adult earns the question even without other red flags." } ],
    serious:["vascular","arterial","pad","pvd","peripheral","fracture","tumor","cancer","malignan","metast","aneurysm"]
  },
  blurb:"Eight months of low back and leg symptoms in a 71-year-old who has slowed down and wants that back.",
  stem:{ ctx:"Margaret, 71. Self-referred, no physician diagnosis. Eight months of low back and leg symptoms.", quote:"“It started about eight months ago and it has gotten worse since then. I have had to stop doing some of the things I used to do. I would like to get back to them.”" },
  subjective:[
    { id:"loc", label:"Location and referral", text:"Both buttocks and the backs of both thighs, symmetrical side to side. No pain in the middle of her low back. Nothing below either knee." },
    { id:"agg", label:"Aggravating factors", text:"Symptoms come on after about one block of walking, and after a few minutes standing at the kitchen counter. Walking downhill is worse than walking uphill." },
    { id:"ease", label:"Easing factors", text:"They ease within a few minutes of sitting down. She has noticed she can walk much further around the supermarket leaning on a shopping cart than she can around the block." },
    { id:"day", label:"24-hour behavior", text:"No pain at rest and none in bed. She wakes comfortable. Symptoms build through the day in proportion to how much she has been on her feet." },
    { id:"flags", label:"Screening questions", text:"No bowel or bladder change and no saddle numbness. No unexplained weight loss, no fever, no history of cancer, no trauma. Hypertension, controlled with medication." },
    { id:"neuro", label:"Neurological symptoms", text:"No numbness or tingling reported. No weakness noticed, although she says both legs feel heavy once the symptoms have started." },
    { id:"hist", label:"History, work and goals", text:"Eight months, gradually worsening. No previous episodes. She walks her dog every morning and has cut the route in half. That is what she wants back." }
  ],
  measures:[
    { t:"g", lab:"Lumbar active range of motion with overpressure", id:"arom",
      res:"Extension limited about 50% and reproduces the buttock symptoms. Flexion full and comfortable.",
      why:"Establishes the movement pattern and, more usefully, shows that extension provokes and flexion does not. That asymmetry is the whole picture in a stenotic presentation." },
    { t:"g", lab:"Timed walking test to symptom onset", id:"walk",
      res:"Symptoms begin at 95 seconds of level walking. Resolve within 2 minutes of sitting.",
      why:"Quantifies the complaint in a way you can re-measure, and it is the measure that matters to her. Distance or time to onset beats a pain score in this presentation." },
    { t:"g", lab:"Lower quarter neurological screen", id:"neuro",
      res:"Myotomes five out of five, dermatomes intact, reflexes two plus and symmetric.",
      why:"Expected normal, and a predicted normal is still a prediction. In an older adult with bilateral leg symptoms you close this before loading her." },
    { t:"y", lab:"Passive hip range of motion", id:"hip",
      res:"Internal rotation 28 degrees bilaterally. No groin pain reproduced.",
      why:"Reasonable to screen the hip in a 71-year-old with buttock pain. It does not discriminate here, and it costs time you could spend on the walking test." },
    { t:"y", lab:"Trunk extensor endurance test", id:"end",
      res:"Holds 42 seconds before losing position.",
      why:"Below typical values and relevant to her program later. It is provocative in a patient whose symptoms are extension-driven, so it is poorly timed today." },
    { t:"r", lab:"Sacroiliac provocation cluster — four tests", id:"sij",
      res:"None of the four reproduces her symptoms.",
      why:"Not indicated. Her symptoms are bilateral, activity-dependent and posture-relieved. Nothing points at the sacroiliac joint, and this is four tests spent on a hypothesis with no support." }
  ],
  special:[
    { t:"g", lab:"Cycling tolerance compared with walking tolerance", id:"bike",
      res:"She cycles for six minutes on a stationary bike without symptoms, having reported symptoms after one block of walking.",
      why:"Separates neurogenic from vascular claudication, which nothing else you have done can do. The chapter gives the reasoning: both cycling and walking increase the demand for blood supply, so vascular claudication worsens with either. Neurogenic claudication worsens with walking and is unaffected by cycling, because of the differing lumbar spine positions the two activities require." },
    { t:"g", lab:"Walking tolerance upright compared with walking flexed over a cart", id:"tread",
      res:"She walks one block before symptoms begin when upright. Leaning over a shopping cart she completes four blocks without symptoms.",
      why:"This isolates posture while holding the activity constant. The chapter notes that a flexed position increases the anteroposterior diameter of the intervertebral canal, so a large difference between upright and flexed walking points straight at a posture-dependent mechanism. The cycling comparison tests demand; this one tests position." },
    { t:"y", lab:"Straight leg raise", id:"slr",
      res:"Negative bilaterally to 75 degrees.",
      why:"Worth performing to check for a neural component, and the expected negative is informative. It does not distinguish between the hypotheses actually competing here." },
    { t:"y", lab:"Slump test", id:"slump",
      res:"Negative bilaterally.",
      why:"Largely duplicates the straight leg raise. Reasonable, and it adds little once the straight leg raise is negative." },
    { t:"r", lab:"Crossed straight leg raise", id:"xslr",
      res:"Negative.",
      why:"Not indicated. It is specific for a large central disc herniation, and she has no unilateral radicular pattern to investigate." },
    { t:"r", lab:"FABER test", id:"faber",
      res:"Negative bilaterally.",
      why:"Not indicated. FABER earns its place when a groin ache or hip question needs localizing, and she has neither." }
  ],
  impairments:[
    { t:"g", lab:"Walking tolerance limited by posture-dependent symptoms", need:"walk" , why:"The impairment that matches both her limitation and her goal. It is posture-dependent rather than distance-dependent, which is what the upright-versus-flexed comparison demonstrated, and it is what the treatment will exploit." },
    { t:"g", lab:"Painful restricted lumbar extension", need:"arom" , why:"Measured, re-measurable, and it names the direction that provokes her. It is also the reason an extension-based program would be exactly the wrong prescription." },
    { t:"y", lab:"Reduced trunk extensor endurance", need:"end" , why:"Real, and worth addressing in a 71-year-old who wants to walk further. It is not what limits her walking distance today, so it belongs in the plan of care rather than at the top of it." },
    { t:"y", lab:"Reduced hip internal rotation", need:"hip" , why:"A genuine finding at 28 degrees bilaterally. It does not explain her symptoms and it does not change today's plan, which is why it ranks below the two above it." },
    { t:"r", lab:"Lower extremity neurological deficit", need:"neuro",
      why:"Not present. Her neurological screen was normal, so this impairment does not exist to be treated." },
    { t:"r", lab:"Sacroiliac joint dysfunction", need:"sij",
      why:"Not present. The provocation cluster was negative and nothing in her presentation pointed there." },
    { t:"r", lab:"Directional preference for extension", need:"arom",
      why:"The opposite of what you found. Extension provokes her; flexion relieves her. Selecting this means the movement examination was read backwards." }
  ],
  interventions:[
    { t:"g", lab:"Flexion-biased exercise program",
      why:"Matched to the direction that relieves her. Flexion increases the anteroposterior diameter of the canal, which is the mechanism behind every position that helps her." },
    { t:"g", lab:"Graded walking program using a flexed posture",
      why:"Trains the activity she came for, in the posture she tolerates. A cart, poles or an inclined treadmill lets her accumulate walking volume she could not otherwise reach." },
    { t:"g", lab:"Education on positional strategies for daily activities",
      why:"Sitting breaks, leaning on a shopping cart, a foot on a step at the counter. These are free, immediate, and they address the exact situations she described." },
    { t:"y", lab:"Stationary cycling for general conditioning",
      why:"She tolerates it and it maintains cardiovascular fitness. It does not train walking, which is her goal, so it supports the plan rather than being it." },
    { t:"y", lab:"Trunk and hip strengthening",
      why:"Reasonable and appropriate for a 71-year-old, and it addresses a measured impairment if you tested endurance. It is not what limits her walking distance today." },
    { t:"r", lab:"Extension-biased exercise program",
      why:"Not advised. Extension is what provokes her. This is the correct intervention for a different classification and it runs directly against her response." },
    { t:"r", lab:"Thrust manipulation",
      why:"Not advised here. There is no hypomobility finding, symptoms are bilateral, and she does not fit the presentation the manipulation rule was built on." },
    { t:"r", lab:"Rest and activity avoidance until symptoms settle",
      why:"Not advised. Her symptoms settle with rest already, and avoidance reduces the walking tolerance you are trying to build. Deconditioning is the risk here, not flare-up." }
  ],
  outcomes:[
    { t:"g", lab:"Timed or distance walking test",
      why:"The measure that matches her goal and her limitation. It is objective, repeatable, and it is the thing she will notice changing." },
    { t:"g", lab:"Oswestry Disability Index",
      why:"The condition-specific disability measure for this population, and it captures the activities she has given up. Know the minimal detectable change before you call a difference real." },
    { t:"y", lab:"Numeric Pain Rating Scale",
      why:"Quick and meaningful to her, and thin on its own. Her problem is a tolerance limit rather than a pain level." },
    { t:"y", lab:"Patient-Specific Functional Scale",
      why:"Captures the dog walk in her own words, which the Oswestry only handles generically. Arguably strong; the trade-off is that self-nominated items are harder to compare across patients." },
    { t:"r", lab:"Fear-Avoidance Beliefs Questionnaire alone",
      why:"Not as a primary measure. It is a prognostic tool and she is not fear-avoidant — she is walking daily and wants to walk further." },
    { t:"r", lab:"Discharge when she reports feeling better",
      why:"Not a measure. Discharge should rest on a measured change that exceeds error and on the walking goal she named." }
  ],
  discuss:[
    "The bicycle test is the discriminator, and it works because it holds metabolic demand constant and changes only spinal posture. Ask which other finding does the same job.",
    "Everything that helps her involves flexion; everything that provokes her involves extension. Ask the room to name the mechanism before naming the diagnosis.",
    "Her neurological screen is normal and that does not weaken the case. Ask why a normal screen is compatible with this presentation.",
    "She has a goal that is measurable in distance. Ask whether anyone chose a pain measure as their primary outcome, and what that would miss."
  ]
},
{
  id:"pgp", name:"Case 2 — Alina, 34",
  hyp_key:{
    most:{ name:"Pregnancy-related pelvic girdle pain",
      keys:["pelvic girdle","girdle","sacroiliac","sij","si joint","pgp","symphys"],
      why:"Symptoms that began during pregnancy and have not settled five months postpartum are the textbook setting for pelvic girdle pain. The referral points here before anything else." },
    less:[
      { name:"Nonspecific or mechanical low back pain", why:"Always a legitimate candidate, and caring for a toddler and a baby is a heavy mechanical load. It ranks below pelvic girdle pain because the onset was tied to the pregnancy." },
      { name:"Pubic symphysis dysfunction", why:"Part of the pelvic ring and commonly involved in pregnancy. It becomes more likely if there is groin or anterior pelvic pain." } ],
    remote:[
      { name:"Sacral stress fracture", why:"Chapter 29 names a stress fracture of the sacrum as a further source of sacral pain, and the pelvic girdle pain CPG lists sacral stress fracture among its related diagnoses. Unlikely, but it is the one that changes management entirely." },
      { name:"Inflammatory sacroiliitis", why:"Chapter 29 lists sacroiliitis from systemic arthritis, such as ankylosing spondylitis, among the causes of pelvic pain, and the pelvic girdle pain CPG lists sacroiliitis among its related diagnoses. Worth keeping in view if there is prolonged morning stiffness or alternating buttock pain." } ],
    serious:["fracture","inflammat","spondyl","sacroiliitis","infection","tumor"]
  },
  blurb:"Five months postpartum with low back and pelvic pain that has not settled on its own.",
  stem:{ ctx:"Alina, 34. Five months postpartum after her second delivery. Low back symptoms that began during the pregnancy.", quote:"“It started when I was pregnant and it has not settled. I have been told it would go away on its own. It has been five months and I have a toddler and a baby to look after.”" },
  subjective:[
    { id:"loc", label:"Location and referral", text:"Right posterior pelvis, just below and medial to the posterior superior iliac spine. She points to it with one finger. No midline low back pain. An intermittent ache in the right groin. Nothing below the knee." },
    { id:"agg", label:"Aggravating factors", text:"Worst going up stairs, getting out of the car, rolling in bed, and standing on one leg to dress. Walking beyond about fifteen minutes. She also describes an intermittent ache in the right groin that she does not connect to the pelvic pain." },
    { id:"ease", label:"Easing factors", text:"Sitting eases it. Lying down eases it. Nothing has made a lasting difference in five months." },
    { id:"day", label:"24-hour behavior", text:"Worse by the end of the day. She wakes when she rolls over and settles once she has found a position. Sleep is poor, partly because of the baby." },
    { id:"flags", label:"Screening questions", text:"No bowel or bladder change and no saddle numbness. No fever, no weight loss, no trauma. She is breastfeeding." },
    { id:"neuro", label:"Neurological symptoms", text:"No pain below the knee. No numbness or tingling anywhere. No weakness reported." },
    { id:"hist", label:"History, work and goals", text:"Began in the third trimester of her second pregnancy and never resolved. The same thing happened in her first pregnancy and settled by three months postpartum. She wants to carry her toddler on one hip and return to running." }
  ],
  measures:[
    { t:"g", lab:"Active straight leg raise, with and without manual pelvic compression", id:"aslr",
      res:"Right side rated 3 out of 5 for difficulty. Rated 1 out of 5 when you apply manual compression through the ilia.",
      why:"The one test here that is diagnostic and treatment-guiding at the same time. Improvement with compression demonstrates a force closure deficit and tells you what to prescribe." },
    { t:"g", lab:"Lumbar active range of motion with repeated movements", id:"arom",
      res:"Full and pain-free in all directions. No lasting change in symptoms with repeated flexion or extension.",
      why:"Performed to exclude a directional preference, and the absence of one is the finding. It removes the specific exercise subgroup and keeps the focus on load transfer." },
    { t:"g", lab:"Lower quarter neurological screen", id:"neuro",
      res:"Myotomes five out of five, dermatomes intact, reflexes two plus and symmetric.",
      why:"Expected normal, and it closes the last screening question before loading her. A groin ache in a postpartum woman deserves a documented normal." },
    { t:"y", lab:"Single-leg stance and Trendelenburg", id:"trend",
      res:"Positive on the right. Pelvic drop on the left with right single-leg stance, held 8 seconds before symptoms.",
      why:"Directly relevant to her aggravating activities and to the hip abductor contribution to force closure. Useful, and it follows from the active straight leg raise rather than standing alone." },
    { t:"y", lab:"Hip range of motion and resisted testing", id:"hip",
      res:"Full range bilaterally. Resisted adduction reproduces the groin ache faintly.",
      why:"Worth doing because of the groin ache, and the faint adductor response is a real clue toward the anterior pelvic ring. It is secondary to the posterior findings." },
    { t:"r", lab:"Lumbar segmental mobility testing at every level", id:"seg",
      res:"No hypomobile or painful segment identified.",
      why:"Not indicated as a priority. Her symptoms are load-transfer in character with no lumbar directional response, so the lumbar spine is not where this examination should spend its time. The negative result is expected and changes nothing." }
  ],
  special:[
    { t:"g", lab:"Thigh thrust (posterior pelvic pain provocation)", id:"p4",
      res:"Reproduces her familiar right posterior pelvic pain.",
      why:"Highest sensitivity of the provocation tests, so it is one of the two the sequencing starts with. A positive here plus a positive distraction is enough to stop testing." },
    { t:"g", lab:"Distraction test", id:"dist",
      res:"Reproduces her familiar right posterior pelvic pain.",
      why:"Highest specificity of the provocation tests. With thigh thrust also positive, the two-of-four threshold is met and the cluster is complete." },
    { t:"y", lab:"Compression test", id:"comp",
      res:"Reproduces her familiar right posterior pelvic pain.",
      why:"A third positive in the cluster, and it changes nothing. The sequencing begins with distraction and thigh thrust, and the chapter states that if both reproduce the pain, further tests are not indicated. Useful to have performed; better to have stopped." },
    { t:"y", lab:"Pubic symphysis palpation and pubic stress test", id:"pubic",
      res:"Mild tenderness over the symphysis. Stress test negative.",
      why:"Worth doing because of the groin ache — the pubic stress test is 81% sensitive and 99% specific for symphysiolysis. A negative here largely closes the anterior ring." },
    { t:"r", lab:"Straight leg raise", id:"slr",
      res:"Negative bilaterally.",
      why:"Not indicated as a priority. She has no symptoms below the knee, no paraesthesia and no neurological signs, so there is no neural hypothesis for it to address." },
    { t:"y", lab:"Long dorsal sacroiliac ligament test", id:"ldl",
      res:"Local tenderness on the right, reproducing her familiar pain.",
      why:"Taught specifically for pregnancy-related and ligamentous posterior pelvic pain, and it fits her presentation. It supports the picture rather than deciding it — tenderness is less specific than provocation." }
  ],
  impairments:[
    { t:"g", lab:"Failed load transfer through the pelvis", need:"aslr" , why:"The central impairment, and the only one you demonstrated changing inside the clinic. Her active straight leg raise went from 3 out of 5 to 1 with manual compression — the impairment and the treatment direction in a single test." },
    { t:"g", lab:"Sacroiliac joint pain reproduced on loading", need:["p4","dist","comp"] , why:"Two of four provocation tests reproduce her familiar pain, which meets the threshold. It localizes the source without claiming a structural lesion you cannot see." },
    { t:"y", lab:"Hip abductor weakness on the right", need:"trend" , why:"A positive Trendelenburg on the symptomatic side, and abductor function contributes to force closure. A contributor rather than the primary impairment." },
    { t:"y", lab:"Adductor-related groin pain", need:"hip" , why:"Resisted adduction reproduced the groin ache faintly and the pubic stress test was negative, so the anterior ring is largely closed. Worth recording, minor in the plan." },
    { t:"r", lab:"Directional preference for extension", need:"arom",
      why:"Not present. Repeated movements produced no lasting change in either direction, which is why she is not a specific exercise case." },
    { t:"r", lab:"Lumbar segmental hypomobility", need:"seg",

  { v:"31-year-old, 8 days of low back pain after a heavy gym session. No symptoms below the knee. Fear-avoidance work score 11. Hip internal rotation 40 degrees. Painful arc on return from flexion. Spring testing reveals hypermobility at L4–5 with pain reproduction.",
    a:2, why:"The hardest item here. Four manipulation criteria are met — recent onset, nothing below the knee, fear-avoidance under 19, and a hip over 35 degrees — so it reads as a manipulation case on the surface. But the manipulation rule requires HYPOmobility on spring testing and he is HYPERmobile. Add the aberrant movement and it is stabilization. One segmental finding flips the whole answer." },
  { v:"45-year-old, 3 months of low back pain with referral into the right buttock. No aberrant movement, negative prone instability test. Repeated flexion in lying abolishes the buttock pain and it stays gone.",
    a:1, why:"The direction is flexion, not extension. The subgroup is defined by centralization with a tested direction, whichever direction that turns out to be, and centralization requires referred symptoms to retreat. Students default to extension because that is the example they were taught." },
  { v:"38-year-old, 2 weeks of back pain with intermittent buttock pain to the mid-thigh. No neurological signs. Repeated movements in every direction produce no lasting change. Segmental testing reveals a hypomobile painful L4–5. Fear-avoidance work score 12.",
    a:0, why:"No directional response, so specific exercise is out. No instability findings, so stabilization is out. No nerve root signs, so traction is out. Under 16 days, nothing below the knee, low fear-avoidance and a hypomobile segment leave manipulation — and buttock-to-mid-thigh pain is not 'distal to the knee'." }
];
const SUBS=['Manipulation','Specific exercise','Stabilization','Traction'];
let wi=0, wAns=[];

const TOPIC_KEYS={
  loc:["where","locat","point","show me","radiat","travel","spread","below the knee","refer","area","exactly is"],
  agg:["worse","aggravat","provoke","bring it on","brings it on","what makes it worse","flare","trigger","hurt more","increase"],
  ease:["better","ease","eas","relie","help","settle","improve","comfortable","reduce"],
  day:["morning","night","sleep","evening","wake","24","day go","end of the day","through the day","first thing","at rest"],
  flags:["red flag","bowel","bladder","saddle","weight","fever","cancer","night sweat","trauma","fall","steroid","unwell","screen","systemic"],
  neuro:["numb","tingl","weak","pins","needles","sensation","nerve","foot drop","strength","give way","drop"],
  hist:["work","job","occupation","goal","living","previous","prior","episode","history","before","how long","duration","activity","want to","hobby","sport","exercise"]
};
const TIERNAME={g:"Strong choice",y:"Acceptable",r:"Not advised"};
let C=null, si=0, picks={}, text={}, hyp=["","",""], qs=["","",""], elicited=[], notAsked=[], revealed=false;

const STEPS=[
  {k:"stem",lab:"Referral"},{k:"stands",lab:"Stands out"},{k:"hypotheses",lab:"Hypotheses"},

  {k:"measures",lab:"Measures",pick:2},{k:"special",lab:"Special tests",pick:2},
  {k:"impairments",lab:"Impairments",pick:3},{k:"interventions",lab:"Plan",pick:3},
  {k:"outcomes",lab:"Outcome",pick:1},{k:"summary",lab:"Summary"}
];


function shuffle(a){
  const out=a.slice();
  for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
// Options are authored grouped by tier. Shuffle once per run so position carries no signal.
function prepCase(c){
  const copy=Object.assign({},c);
  ['measures','special','impairments','interventions','outcomes'].forEach(k=>{
    if(Array.isArray(copy[k])) copy[k]=shuffle(copy[k]);
  });
  return copy;
}

function render(){
  drawBar();
  document.getElementById('h1').textContent=C.name;
  document.getElementById('hsub').textContent='Your written answers are yours. Your selections are scored at the end.';

  stage.innerHTML='';

  if(st.k==='stands') return renderStands();
  if(st.k==='hypotheses') return renderHyp();
  if(st.k==='questions') return renderQuestions();
  if(st.k==='subjective') return renderSubjective();
  if(st.k==='summary') return renderSummary();
  return renderPick(st);
}

function matchTopics(){
  const hit=new Set();
  qs.forEach(q=>{
    const t=(q||'').toLowerCase();
    if(!t.trim()) return;
    Object.keys(TOPIC_KEYS).forEach(k=>{
      if(TOPIC_KEYS[k].some(w=>t.includes(w))) hit.add(k);
    });
  });
  return hit;
}

function renderPick(st){
  const items=C[st.k];
  picks[st.k]=picks[st.k]||[];
  const need=Math.max(1,Math.min(st.pick, items.length-1));
  const TITLES={measures:'Choose your tests and measures',special:'Choose your special tests',
    impairments:'Identify the impairments',interventions:'Choose your interventions',outcomes:'Choose an outcome measure'};
  const TASKS={
    measures:'Which TWO tests and measures do you perform first?',
    special:'Which TWO special tests do you perform?',
    impairments:'Based on what you found, identify THREE impairments.',
    interventions:'Choose THREE interventions for the first visit.',
    outcomes:'Choose ONE outcome measure to track her progress.'};
  const HINTS={
    measures:'You will see the result of anything you choose.',
    special:'Choose for what a positive AND a negative would each tell you.',
    impairments:'Only choose what your examination actually showed you.',
    interventions:'Match the intervention to the finding, not to the diagnosis.',
    outcomes:'One measure. Make it the one that matches the problem.'};
  const h=document.createElement('h2'); h.textContent=TITLES[st.k]; stage.appendChild(h);
  const t=document.createElement('div'); t.className='task';
  t.innerHTML='<p>'+TASKS[st.k]+'</p><p class="small">'+HINTS[st.k]+'</p>';
  stage.appendChild(t);
  const m=document.createElement('p'); m.className='meta'; m.id='counter'; stage.appendChild(m);
  items.forEach((it,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.setAttribute('aria-pressed', picks[st.k].includes(idx)?'true':'false');
    const l=document.createElement('span'); l.className='lab'; l.textContent=it.lab; b.appendChild(l);
    b.onclick=()=>{
      const arr=picks[st.k], at=arr.indexOf(idx);
      if(at>=0){ arr.splice(at,1); b.setAttribute('aria-pressed','false');
        const r=b.querySelector('.res'); if(r) r.remove(); }
      else { if(arr.length>=need) return; arr.push(idx); b.setAttribute('aria-pressed','true');
        if(it.res){ const r=document.createElement('div'); r.className='res';
          r.innerHTML='<b>Result</b>'+it.res; b.appendChild(r); } }
      count();
    };
    stage.appendChild(b);
    if(picks[st.k].includes(idx) && it.res){
      const r=document.createElement('div'); r.className='res'; r.innerHTML='<b>Result</b>'+it.res; b.appendChild(r);
    }
  });
  const btn=nextBtn(si===STEPS.length-2?'See summary':'Continue', picks[st.k].length>=need);
  count();
  function count(){
    const n=picks[st.k].length;
    document.getElementById('counter').textContent=n+' of '+need+' selected'+(n<need?' — select '+(need-n)+' more.':'');
    btn.disabled=n<need;
  }
}

function tierOf(k,i){ return C[k][i].t; }

function renderSummary(){
  stage.innerHTML='';
  const h=document.createElement('h2'); h.textContent='Your summary'; stage.appendChild(h);

  // impairments chosen without the test that would reveal them
  const testedIds=[];
  (picks.measures||[]).forEach(i=>testedIds.push(C.measures[i].id));
  (picks.special||[]).forEach(i=>testedIds.push(C.special[i].id));
  const unfounded=(picks.impairments||[]).map(i=>C.impairments[i])
    .filter(im=>{
      if(!im.need) return false;
      const req = Array.isArray(im.need) ? im.need : [im.need];
      return !req.some(r=>testedIds.includes(r));
    });
  if(unfounded.length){
    const w=document.createElement('div'); w.className='warn';
    w.innerHTML='<b>Impairments you named but never tested for</b>'+
      unfounded.map(u=>u.lab).join('; ')+
      '. You may well be right. But you did not perform the test that would have shown it, so at this point it is an assumption rather than a finding — and that is the distinction worth defending in the discussion.';
    stage.appendChild(w);
  }

  const sec=(title,node)=>{ const d=document.createElement('div'); d.className='sumsec';
    const t=document.createElement('h3'); t.textContent=title; d.appendChild(t); d.appendChild(node); stage.appendChild(d); };

  if(text.stands && text.stands.trim()){
    const d=document.createElement('div'); d.className='yours'; d.textContent=text.stands;
    sec('What you said stood out', d);
  }
  if(hyp.filter(x=>x.trim()).length){
    const d=document.createElement('div');
    const HLAB=['Most likely','Less likely','Remote'];
    hyp.forEach((x,i)=>{ if(!x.trim())return; const p=document.createElement('div'); p.className='yours';
      p.textContent=HLAB[i]+' — '+x; d.appendChild(p); });
    sec('Your hypotheses', d);

    const K=C.hyp_key, low=hyp.map(x=>(x||'').toLowerCase());
    const hit=(k,x)=> k.length<=4 ? new RegExp('\\b'+k+'\\b').test(x) : x.includes(k);
    const hasTop = K.most.keys.some(k=>low.some(x=>hit(k,x)));
    const topFirst = K.most.keys.some(k=>hit(k,low[0]));
    const hasSerious = K.serious.some(k=>low.some(x=>hit(k,x)));
    const fb=document.createElement('div');

    const r1=document.createElement('div');
    r1.className='sumrow '+(topFirst?'g':(hasTop?'y':'r'));
    r1.innerHTML='<b>'+(topFirst?'Your top hypothesis matched what the referral most supported'
                  :hasTop?'You named it, but not first'
                  :'The referral most supported something you did not list')+'</b>'+
      '<span class="why"><b style="display:inline;color:inherit">'+K.most.name+'.</b> '+K.most.why+'</span>';
    fb.appendChild(r1);

    const r2=document.createElement('div');
    r2.className='sumrow '+(hasSerious?'g':'y');
    r2.innerHTML='<b>'+(hasSerious?'You kept something serious in view':'Nothing serious made your list')+'</b>'+
      '<span class="why">'+(hasSerious?'Good. ':'Worth one slot every time. ')+
      'Three hypotheses is enough room for the likely answer, a plausible alternative, and the one you cannot afford to miss.</span>';
    fb.appendChild(r2);

    const tbl=document.createElement('div'); tbl.className='sumrow n';
    tbl.innerHTML='<b>What a strong list from this referral looks like</b>'+
      '<span class="why"><b style="display:inline;color:inherit">Most likely — </b>'+K.most.name+'</span>'+
      K.less.map(x=>'<span class="why"><b style="display:inline;color:inherit">Less likely — </b>'+x.name+'. '+x.why+'</span>').join('')+
      K.remote.map(x=>'<span class="why"><b style="display:inline;color:inherit">Remote — </b>'+x.name+'. '+x.why+'</span>').join('')+
      '<span class="why" style="margin-top:9px;font-style:italic">This is judged against the referral alone — the only information you had when you wrote your list. There is no single correct set; the question is whether yours matched the evidence at that moment.</span>';
    fb.appendChild(tbl);
    sec('How your hypotheses compare', fb);
  }
  if(qs.filter(x=>x.trim()).length){
    const d=document.createElement('div');
    qs.forEach((x,i)=>{ if(!x.trim())return; const p=document.createElement('div'); p.className='yours';
      p.textContent=(i+1)+'. '+x; d.appendChild(p); });
    if(elicited.length){
      const r=document.createElement('div'); r.className='sumrow g';
      r.innerHTML='<b>Your questions elicited</b><span class="why">'+elicited.join(' · ')+'</span>';
      d.appendChild(r);
    }
    if(notAsked.length){
      const r=document.createElement('div'); r.className='sumrow '+(revealed?'y':'r');
      r.innerHTML='<b>'+(revealed?'You were given, without asking':'You never found out about')+'</b>'+
        '<span class="why">'+notAsked.join(' · ')+
        '. Three questions cannot cover seven areas — the point is whether the three you chose were the three this patient needed.</span>';
      d.appendChild(r);
    }
    sec('The questions you asked', d);
  }

  let g=0,y=0,r=0;
  ['measures','special','impairments','interventions','outcomes'].forEach(k=>{
    const LABEL={measures:'Tests and measures',special:'Special tests',impairments:'Impairments',
      interventions:'Interventions',outcomes:'Outcome measure'}[k];
    const d=document.createElement('div');
    (picks[k]||[]).forEach(i=>{
      const it=C[k][i]; const t=it.t;
      if(t==='g')g++; else if(t==='y')y++; else if(t==='r')r++;
      const row=document.createElement('div'); row.className='sumrow '+t;
      row.innerHTML='<b>'+it.lab+'</b> — '+TIERNAME[t]+
        (it.why?'<span class="why">'+it.why+'</span>':'');
      d.appendChild(row);
    });
    const missed=C[k].map((it,i)=>({it,i})).filter(o=>o.it.t==='g' && !(picks[k]||[]).includes(o.i));
    if(missed.length){
      const row=document.createElement('div'); row.className='sumrow n';
      row.innerHTML='<b>Strong choices you did not take</b><span class="why">'+
        missed.map(o=>o.it.lab).join(' &nbsp;·&nbsp; ')+'</span>';
      d.appendChild(row);
    }
    sec(LABEL, d);
  });

  const sc=document.createElement('div'); sc.className='sumrow n';
  sc.innerHTML='<b>'+g+' strong &nbsp;·&nbsp; '+y+' acceptable &nbsp;·&nbsp; '+r+' not advised</b>'+
    '<span class="why">Scoring is a prompt for discussion, not a grade. The interesting conversations are about the yellows and about anything you would defend.</span>';
  stage.insertBefore(sc, stage.children[1]);

  const disc=document.createElement('div'); disc.className='disc';
  const dh=document.createElement('h3'); dh.textContent='We will talk this through together'; disc.appendChild(dh);
  const ul=document.createElement('ul');
  C.discuss.forEach(x=>{ const li=document.createElement('li'); li.textContent=x; ul.appendChild(li); });
  disc.appendChild(ul); stage.appendChild(disc);

  const act=document.createElement('div'); act.className='act';
  const pr=document.createElement('button'); pr.className='go'; pr.textContent='Print for your own notes';
  pr.onclick=()=>window.print(); act.appendChild(pr);
  const again=document.createElement('button'); again.className='go ghost'; again.textContent='Choose another case';
  again.onclick=()=>{ C=null; pickCase(); window.scrollTo(0,0); }; act.appendChild(again);
  stage.appendChild(act);
}

warmIntro();
</script>
</body>
</html>
