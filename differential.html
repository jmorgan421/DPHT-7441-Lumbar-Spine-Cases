<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Else Could It Be? — DPHT 7441 Module 5</title>
<style>
  :root{ --navy:#012D46; --teal:#00778B; --ink:#1F2933; --muted:#5A6570;
    --line:#D7DDE2; --tint:#F2F6F8; --tint2:#E8EFF2; --bg:#FFFFFF; --panel:#FFFFFF;
    --g:#1B7F4B; --gbg:#E6F2EA; --r:#B3261E; --rbg:#FBEAE8; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
      --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
      --gbg:#14301F; --rbg:#37191A; --g:#6ED08F; --r:#F09189; } }
  :root[data-theme="dark"]{ --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
    --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
    --gbg:#14301F; --rbg:#37191A; --g:#6ED08F; --r:#F09189; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:840px;margin:0 auto;padding:24px 18px 70px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
  .kick{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--teal);text-transform:uppercase}
  h1{font-size:24px;color:var(--navy);margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .prog{display:flex;justify-content:space-between;align-items:center;margin:14px 0 16px;font-size:13px;color:var(--muted)}
  .dots{display:flex;gap:5px}
  .dot{width:26px;height:5px;border-radius:3px;background:var(--line)}
  .dot.g{background:var(--g)} .dot.r{background:var(--r)} .dot.on{background:var(--navy)}
  .vig{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:15px 17px;margin-bottom:16px;font-size:15.5px}
  .q{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit;font-weight:600}
  .opt:hover{border-color:var(--teal)}
  .opt[disabled]{cursor:default}
  .opt.right{background:var(--gbg);border-color:var(--g);color:var(--g)}
  .opt.wrong{background:var(--rbg);border-color:var(--r);color:var(--r)}
  .opt.dim{opacity:.4}
  .fb{border-radius:8px;padding:14px 16px;margin-top:12px;font-size:14px}
  .fb.g{background:var(--gbg)} .fb.r{background:var(--rbg)}
  .fb b{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
  .fb.g b{color:var(--g)} .fb.r b{color:var(--r)}
  .act{display:flex;gap:10px;margin-top:16px}
  button.go{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
  .final{background:var(--tint2);border-radius:8px;padding:18px;text-align:center;margin-bottom:16px}
  .final .n{font-size:36px;font-weight:700;color:var(--navy);display:block}
  .rev{padding:12px 14px;border-radius:7px;margin-bottom:8px;font-size:13.5px;background:var(--tint)}
  .rev b{color:var(--navy)}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  @media(max-width:560px){h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kick">DPHT 7441 &nbsp;|&nbsp; Module 5 &nbsp;|&nbsp; Differential Practice</div>
  <h1>What Else Could It Be?</h1>
  <div class="sub">Six patients. Name the most likely diagnosis, then name the one finding that separates it from the runner-up. Feedback after every answer.</div>
</header>
<div class="prog"><span id="count">Case 1 of 6</span><div class="dots" id="dots"></div></div>
<main id="stage" aria-live="polite"></main>
<footer>Nothing is saved, submitted, or graded.</footer>
</div>

<script>
const CASES = [
{
  name:"Zygapophyseal (facet) syndrome",
  v:"54-year-old warehouse supervisor. Six weeks of right-sided low back pain spreading into the buttock. Worse standing and walking, worse still when she reaches overhead and turns to the right. Eased by sitting and by leaning forward on a cart. No symptoms below the knee, no numbness or tingling. Repeated flexion and repeated extension produce no lasting change in either direction.",
  dx:[
    { t:"g", lab:"Zygapophyseal (facet) syndrome",
      why:"Extension with rotation provokes her, flexion and sitting ease her, and nothing centralizes. Dutton describes facet syndrome as unilateral low back pain aggravated by certain movements, particularly at the end of flexion and extension range. Referral into the buttock is expected." },
    { t:"r", lab:"Sacroiliac joint dysfunction",
      why:"The strongest competitor and it does not fit. SIJ pain is provoked by transitional and single-leg loading rather than by a movement direction, and nothing here points to load transfer failure." },
    { t:"r", lab:"Lumbar radiculopathy",
      why:"No symptoms below the knee, no paresthesia, no weakness. There is nothing neural to explain." },
    { t:"r", lab:"Lumbar spinal stenosis",
      why:"Her walking is limited and her direction is wrong. Stenosis eases with flexion and worsens with extension — which she has — but stenosis is bilateral, activity-dependent and posture-relieved rather than movement-provoked, and she is 54 with a six-week history." },
    { t:"r", lab:"Nonspecific low back pain",
      why:"A legitimate default, and premature. She has a reproducible directional provocation and a plausible structure. Reach for nonspecific when the examination is unrevealing, not before it." }
  ],
  sep:[
    { t:"g", lab:"Reproduction on extension with ipsilateral rotation, plus localized segmental tenderness",
      why:"This is what separates facet from SIJ. Facet is provoked by a movement direction and is tender over the segment; the SIJ is provoked by loading and cannot be validly assessed by palpation at all." },
    { t:"r", lab:"A positive straight leg raise",
      why:"Tests neural tissue, which neither hypothesis involves. A negative was expected and it discriminates nothing here." },
    { t:"r", lab:"Two of four positive on the sacroiliac provocation cluster",
      why:"It would raise the SIJ, and a negative cluster does not confirm facet. Ruling one competitor out is weaker than demonstrating the finding your own hypothesis predicts." },
    { t:"r", lab:"Centralization with repeated extension",
      why:"She already showed no lasting change in either direction, so this finding is not available. It would also move her into a different subgroup entirely." }
  ]
},
{
  name:"Piriformis syndrome",
  v:"32-year-old cyclist. Three months of deep right buttock pain that radiates down the back of the thigh to mid-calf. Worst after 40 minutes on a hard seat and during long rides. Tender on deep palpation in the gluteal region. Myotomes, dermatomes and reflexes are normal. Straight leg raise negative at 80 degrees. Passive hip flexion with adduction and internal rotation reproduces his familiar pain.",
  dx:[
    { t:"g", lab:"Piriformis syndrome",
      why:"Deep buttock pain radiating down the posterior thigh and worse with prolonged sitting — the presentation the hip pathologies recording describes — reproduced by a position that lengthens the piriformis, with a normal neurological screen and a negative straight leg raise. This is PSEUDORADICULAR pain, which Dutton defines as pain radicular in distribution but caused by something other than the nerve root. It tends to be deep, dull and aching rather than sharp and shooting; it spreads across the buttock and back of the thigh rather than along one dermatome; it comes without dermatomal numbness, myotomal weakness or reflex change; and it is reproduced by loading the tissue causing it. Because the piriformis compresses the sciatic nerve itself, some tingling can occur — so the screen and the provocation test separate it, not the symptom quality alone. The sciatic nerve usually passes below the muscle, but in roughly 15% of people the tibial part passes through the belly." },
    { t:"r", lab:"Lumbar radiculopathy",
      why:"The competitor worth naming. Pseudoradicular means radicular in distribution and caused by something other than nerve root irritation — and his neurological screen and straight leg raise are both normal, which a genuine radiculopathy at this intensity would be unlikely to leave untouched." },
    { t:"r", lab:"Sacroiliac joint dysfunction",
      why:"Same territory, wrong provocation. His symptoms follow sustained sitting and a stretched position, not transitional or single-leg loading." },
    { t:"r", lab:"Hamstring tendinopathy",
      why:"Plausible in a cyclist with sitting-related buttock pain, and it would be reproduced by resisted knee flexion and by loading the tendon, not by passive hip adduction and internal rotation." },
    { t:"r", lab:"Zygapophyseal (facet) syndrome",
      why:"No directional provocation, no segmental tenderness, and the symptoms extend well past the usual facet referral pattern in a patient with a positional cause." }
  ],
  sep:[
    { t:"g", lab:"Hip flexion, adduction and internal rotation reproducing it, with a normal neurological screen and negative straight leg raise",
      why:"Both halves are needed. The provocation points TOWARD piriformis: Dutton Chapter 19 gives the FAIR test — flexion, adduction, internal rotation — 88% sensitivity, 83% specificity, and a positive likelihood ratio of 5.2. The normal neurological screen and negative straight leg raise point AWAY from a nerve root, since the straight leg raise is sensitive for disc herniation. Pseudoradicular means radicular in distribution without root involvement — and that is exactly this combination." },
    { t:"r", lab:"Tenderness on deep gluteal palpation",
      why:"Supportive and not discriminating. A tender gluteal region is common in both presentations, and tenderness is among the least specific findings available to you." },
    { t:"r", lab:"Pain with prolonged sitting",
      why:"Both hypotheses do this. Sitting loads the disc and compresses the gluteal region at the same time." },
    { t:"r", lab:"A positive slump test",
      why:"It would point the other way, toward neural involvement. His slump and straight leg raise being negative is precisely what makes piriformis the better answer." }
  ]
},
{
  name:"Spondylolysis with spondylolisthesis",
  v:"16-year-old competitive gymnast. Four months of central low back pain that has become constant. Worst during back walkovers and landing, eased by rest and by sitting. Extension in standing reproduces it sharply; flexion does not. Neurological screen normal. She has trained through it for two seasons and has recently been struggling with the same skills she used to land easily.",
  dx:[
    { t:"g", lab:"Spondylolysis, with or without spondylolisthesis",
      why:"Adolescent athlete, extension-dominant sport, extension-provoked central pain, months of loading through it. Spondylolysis is a bony defect of the pars interarticularis, and its etiology ranges from a stress fracture to a traumatic one — the repetitive extension of gymnastics is the classic mechanism." },
    { t:"r", lab:"Movement coordination impairment",
      why:"The closest competitor, and the one to argue about. It would explain recurrent symptoms in a young athlete, but it does not explain four months of constant, progressively worsening, extension-specific pain in a sport that loads the pars." },
    { t:"r", lab:"Nonspecific low back pain",
      why:"Not advised in an adolescent athlete with a months-long history, a specific provoking direction and a sport-specific mechanism. This is the presentation where defaulting to nonspecific misses something." },
    { t:"r", lab:"Lumbar disc herniation",
      why:"Wrong direction and wrong age profile. Discogenic pain typically shows a flexion bias, and she is eased by sitting and flexion." },
    { t:"r", lab:"Sacroiliac joint dysfunction",
      why:"Central rather than unilateral, and provoked by a spinal movement rather than by load transfer through the pelvis." }
  ],
  sep:[
    { t:"g", lab:"Pain reproduced specifically by extension in a young athlete with months of symptoms",
      why:"Direction plus age plus sport is the combination that raises a pars lesion above a control problem. Neither diagnosis is confirmed clinically — this is the presentation that earns imaging, and the reasoning is what tells you to ask for it." },
    { t:"r", lab:"A positive prone instability test",
      why:"It would raise movement coordination impairment, and a positive does not exclude a pars defect. Spondylolisthesis and clinical instability can coexist, so this test cannot do the separating." },
    { t:"r", lab:"Full and pain-free lumbar flexion",
      why:"True in her case and true in many presentations. It tells you the problem is not flexion-driven; it does not tell you which extension-driven problem she has." },
    { t:"r", lab:"A normal neurological screen",
      why:"Expected in both, and reassuring rather than discriminating. A low-grade slip would not be expected to produce neurological signs." }
  ]
},
{
  name:"Vertebral compression fracture",
  v:"74-year-old woman. Two weeks of pain across the thoracolumbar junction that began the morning after she lifted a full laundry basket. Sharp with every attempt to stand or walk, almost absent when she lies flat. Focal tenderness directly over the midline spinous processes. Eight years of oral prednisone for polymyalgia rheumatica. Neurological screen normal. No bowel or bladder change.",
  dx:[
    { t:"g", lab:"Vertebral compression fracture",
      why:"Age over 70, long-term corticosteroid exposure, a low-impact lifting mechanism, focal midline tenderness and pain that is severe on weight bearing and relieved by lying down. The chapter describes exactly this — sudden thoracolumbar pain after low-impact trauma such as lifting in a flexed position." },
    { t:"r", lab:"Acute low back pain with mobility deficits",
      why:"The default that would get her hurt. The presentation looks mechanical because it started with a lift, and the age, the steroid history and the focal midline tenderness are what should stop you treating it as one." },
    { t:"r", lab:"Lumbar spinal stenosis",
      why:"Wrong tempo and wrong pattern. Stenosis is insidious and activity-dependent over months to years; hers began on a specific morning two weeks ago." },
    { t:"r", lab:"Zygapophyseal (facet) syndrome",
      why:"Facet pain is provoked by a movement direction rather than by all weight bearing, and it does not usually abolish with lying flat." },
    { t:"r", lab:"Metastatic disease",
      why:"It belongs on the list and it is not the first answer. She has no cancer history, no weight loss, no constitutional symptoms and no night pain unrelieved by rest — and she has two separate fracture risk factors." }
  ],
  sep:[
    { t:"g", lab:"Focal midline tenderness with age over 70 and long-term corticosteroid use",
      why:"Three triggers at once. Dutton lists history of trauma, age over 50 and age over 70 as fracture flags. Long-term oral corticosteroid use is a well-established additional risk to bone, and she has years of it. Any one warrants care; together they change the plan rather than the differential." },
    { t:"r", lab:"Pain relieved by lying down",
      why:"Useful, and it points the other way in a different sense — relief with recumbency argues AGAINST tumor and infection. It does not separate fracture from a mechanical problem, because both are eased by unloading." },
    { t:"r", lab:"A normal neurological screen",
      why:"Expected in an uncomplicated compression fracture, so it discriminates nothing. It tells you there is no cord or root involvement, which matters for management rather than for diagnosis." },
    { t:"r", lab:"Reproduction on repeated flexion",
      why:"Provocative and unhelpful. In a suspected fracture, repeated loading into the direction of injury is the last thing you want to do for diagnostic information you can get another way." }
  ]
},
{
  name:"Inflammatory back pain",
  v:"26-year-old man. Eight months of low back and buttock pain that alternates sides. It came on gradually with no injury. He is stiff for over an hour every morning, loosens up once he gets moving, and finds that rest makes it worse rather than better. He wakes at around four in the morning with pain and has to get up and walk. An older brother has something similar.",
  dx:[
    { t:"g", lab:"Inflammatory back pain",
      why:"Dutton gives four questions to ask anyone under 45 with more than three months of symptoms: morning stiffness over 30 minutes, waking in the second half of the night, pain alternating between the buttocks, and whether rest relieves it. He answers yes to the first three and rest makes his pain worse — all four positive. Two of four gives 70% sensitivity and 81% specificity; three of four drops sensitivity to 33% but specificity approaches 100%. He also fits the wider predictors: onset under 40 and insidious onset." },
    { t:"r", lab:"Sacroiliac joint dysfunction",
      why:"The most seductive wrong answer, because alternating buttock pain sounds sacroiliac. Mechanical SIJ pain is unilateral and load-related; it does not alternate sides, it does not produce an hour of morning stiffness, and it does not improve with exercise and worsen with rest." },
    { t:"r", lab:"Nonspecific low back pain",
      why:"Eight months of insidious symptoms in a 26-year-old with night pain and prolonged morning stiffness is not where nonspecific belongs. Defaulting here is how axial spondyloarthritis gets an average diagnostic delay measured in years." },
    { t:"r", lab:"Lumbar disc herniation",
      why:"No leg symptoms, no neurological features, and a symptom pattern that improves with movement rather than with unloading." },
    { t:"r", lab:"Movement coordination impairment",
      why:"It would explain a young patient with recurrent back pain, and nothing here is recurrent — it has been continuous for eight months — and nothing explains the morning stiffness or the night waking." }
  ],
  sep:[
    { t:"g", lab:"Morning stiffness over 30 minutes that improves with exercise but not with rest",
      why:"The single most discriminating pair in the set. Dutton frames inflammatory conditions as producing their greatest symptoms in the morning after tissues stiffen, and mechanically based pain as increasing with activity through the day. His pattern is the exact inverse of mechanical." },
    { t:"r", lab:"Alternating buttock pain",
      why:"One of the four predictors, and on its own it is what sends people toward the sacroiliac joint. It needs the stiffness and activity pattern beside it to mean anything." },
    { t:"r", lab:"A positive sacroiliac provocation cluster",
      why:"It may well be positive, and that is the trap. Provocation testing reproduces pain from an inflamed joint just as readily as from a mechanically dysfunctional one. A positive cluster here would confirm the wrong story." },
    { t:"r", lab:"A normal neurological screen",
      why:"Expected, and it separates nothing. Every hypothesis on this list predicts it." }
  ]
},
{
  name:"Hip osteoarthritis referring to the buttock",
  v:"68-year-old retired teacher. A year of right buttock and groin ache, gradually worsening. Worst getting out of the car and after walking twenty minutes. He has stopped putting his own sock on that side. Lumbar active range of motion is full and completely painless in every direction. Passive hip internal rotation is 15 degrees on the right and 35 on the left, with a firm end feel and groin pain.",
  dx:[
    { t:"g", lab:"Hip osteoarthritis",
      why:"Groin pain with restricted and painful hip internal rotation, difficulty with sock donning, and a completely painless lumbar examination. When the lumbar spine moves fully and painlessly, it is not the source." },
    { t:"r", lab:"Sacroiliac joint dysfunction",
      why:"Buttock and groin pain is inside the SIJ referral field, which is why this is the competitor. But the SIJ does not restrict hip internal rotation, and a year of progressive loss of hip range with a firm end feel is a joint problem in the hip itself." },
    { t:"r", lab:"Lumbar spinal stenosis",
      why:"His walking is limited, and his lumbar examination is entirely normal and painless. Stenosis in a 68-year-old is worth considering and it does not restrict passive hip rotation." },
    { t:"r", lab:"Zygapophyseal (facet) syndrome",
      why:"It refers into the buttock, and it would be expected to provoke on a lumbar movement direction. His lumbar range is full and painless in every direction." },
    { t:"r", lab:"Piriformis syndrome",
      why:"Deep buttock pain fits, and the groin does not, and neither does a 20-degree side-to-side difference in passive hip internal rotation with a firm end feel." }
  ],
  sep:[
    { t:"g", lab:"Restricted and painful passive hip internal rotation with a full, painless lumbar examination",
      why:"Two findings pointing the same way. The restriction localizes the problem to the hip joint, and the normal lumbar examination removes the spine. Neither alone is enough; together they are decisive." },
    { t:"r", lab:"Groin pain",
      why:"The reason this case is on the list. The groin is shared territory — the hip, the pubic symphysis, a high lumbar disc, an upper lumbar facet and the sacroiliac joint all refer there. Groin pain alone discriminates nothing." },
    { t:"r", lab:"A positive FABER test",
      why:"Closer, and still ambiguous without asking where it hurt. FABER reproducing GROIN pain points at the hip; FABER reproducing POSTERIOR pain points at the sacroiliac joint. The test result means nothing until you record the location." },
    { t:"r", lab:"Difficulty putting on a sock",
      why:"Highly suggestive and not a test. It is a functional consequence of restricted hip flexion and rotation, which is worth recording as an activity limitation rather than used as your discriminator." }
  ]
}
];

const sh=a=>{const o=a.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};
const DECK = CASES.map(c=>({ name:c.name, v:c.v, dx:sh(c.dx), sep:sh(c.sep) }));

let ci=0, phase='dx', score=[];
const stage=document.getElementById('stage'), dots=document.getElementById('dots'), count=document.getElementById('count');

function drawDots(){
  dots.innerHTML='';
  DECK.forEach((c,k)=>{
    const d=document.createElement('div');
    d.className='dot'+(score[k]===undefined?(k===ci?' on':''):(score[k]===2?' g':(score[k]===0?' r':'')));
    dots.appendChild(d);
  });
}

function render(){
  drawDots();
  if(ci>=DECK.length) return renderFinal();
  count.textContent='Case '+(ci+1)+' of '+DECK.length;
  const c=DECK[ci];
  stage.innerHTML='';
  const v=document.createElement('div');v.className='vig';v.textContent=c.v;stage.appendChild(v);
  const q=document.createElement('div');q.className='q';
  q.textContent = phase==='dx' ? 'Most likely diagnosis?' : 'Which ONE finding separates your answer from the runner-up?';
  stage.appendChild(q);
  const items = phase==='dx' ? c.dx : c.sep;
  const wrap=document.createElement('div');
  items.forEach((it,k)=>{
    const b=document.createElement('button');b.className='opt';b.type='button';b.textContent=it.lab;
    b.onclick=()=>answer(k,wrap,items);wrap.appendChild(b);
  });
  stage.appendChild(wrap);
}

function answer(k,wrap,items){
  const correct = items[k].t==='g';
  score[ci]=(score[ci]||0)+(correct?1:0);
  [...wrap.children].forEach((b,idx)=>{
    b.disabled=true;
    if(items[idx].t==='g') b.classList.add('right');
    else if(idx===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const f=document.createElement('div');f.className='fb '+(correct?'g':'r');
  const chosen=items[k], right=items.find(x=>x.t==='g');
  f.innerHTML='<b>'+(correct?'Correct':'Not this one')+'</b>'+
    (correct ? right.why : '<b style="margin-top:0">Your answer</b>'+chosen.why+
      '<b style="margin-top:10px">'+right.lab+'</b>'+right.why);
  stage.appendChild(f);
  const a=document.createElement('div');a.className='act';
  const b=document.createElement('button');b.className='go';
  b.textContent = phase==='dx' ? 'Now: what separates it?' : (ci===DECK.length-1?'See score':'Next case');
  b.onclick=()=>{ if(phase==='dx'){phase='sep';} else {phase='dx';ci++;} render(); window.scrollTo(0,0); };
  a.appendChild(b);stage.appendChild(a);
  drawDots();
}

function renderFinal(){
  count.textContent='Complete';
  const total=score.reduce((a,b)=>a+b,0);
  stage.innerHTML='';
  const f=document.createElement('div');f.className='final';
  f.innerHTML='<span class="n">'+total+' / '+(DECK.length*2)+'</span>'+
    (total>=10?'Strong. You are discriminating on findings rather than on the complaint.'
     :total>=7?'Solid. Look at which separators you missed — that is usually where the reasoning is thin.'
     :'Worth another pass. The diagnosis is the easy half; naming what separates it is the skill.');
  stage.appendChild(f);
  DECK.forEach((c,k)=>{
    const d=document.createElement('div');d.className='rev';
    d.innerHTML='<b>'+c.name+'</b><br>'+c.sep.find(x=>x.t==='g').lab;
    stage.appendChild(d);
  });
  const note=document.createElement('div');note.className='rev';
  note.innerHTML='<b>We will talk this through together</b><br>When everyone is back, we go through which diagnoses and which separators caught people.<br><br><b>The pattern across all six</b><br>All six could describe their pain in nearly the same words, and not one was separated by where it hurt.<br><br>FIVE of the six needed something you found on EXAMINATION — a direction that provokes, a normal screen sitting next to an abnormal one, a restricted joint in the neighborhood. ONE was decided entirely by history before you touched him. Knowing which situation you are in is its own skill.';
  stage.appendChild(note);
  const a=document.createElement('div');a.className='act';
  const b=document.createElement('button');b.className='go ghost';b.textContent='Try again';
  b.onclick=()=>{ci=0;phase='dx';score=[];render();window.scrollTo(0,0);};a.appendChild(b);
  stage.appendChild(a);
}
render();
</script>
</body>
</html>
