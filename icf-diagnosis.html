<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write the PT Diagnosis — DPHT 7441 Module 5</title>
<style>
  :root{ --navy:#012D46; --teal:#00778B; --ink:#1F2933; --muted:#5A6570;
    --line:#D7DDE2; --tint:#F2F6F8; --tint2:#E8EFF2; --bg:#FFFFFF; --panel:#FFFFFF;
    --g:#1B7F4B; --gbg:#E6F2EA; --y:#9A6700; --ybg:#FBF2DF; --r:#B3261E; --rbg:#FBEAE8; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
      --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
      --gbg:#14301F; --ybg:#31270F; --rbg:#37191A; --g:#6ED08F; --y:#E2B44C; --r:#F09189; } }
  :root[data-theme="dark"]{ --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
    --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
    --gbg:#14301F; --ybg:#31270F; --rbg:#37191A; --g:#6ED08F; --y:#E2B44C; --r:#F09189; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:880px;margin:0 auto;padding:24px 18px 80px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
  .kick{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--teal);text-transform:uppercase}
  h1{font-size:25px;color:var(--navy);margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  h2{font-size:20px;color:var(--navy);margin:0 0 10px}
  .task{background:var(--navy);color:#fff;border-radius:8px;padding:14px 16px;margin:0 0 14px}
  .task p{margin:0;font-size:16px;font-weight:600}
  .task .small{font-weight:400;font-size:13px;opacity:.85;margin-top:6px}
  .bank{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
  .bank h3{margin:0 0 8px;font-size:11px;letter-spacing:.9px;color:var(--teal);text-transform:uppercase}
  .bank ul{margin:0;padding-left:18px;columns:2;column-gap:28px}
  .bank li{font-size:14px;margin-bottom:5px;break-inside:avoid}
  label.fl{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 2px}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 6px}
  textarea{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:7px;padding:10px 12px;min-height:72px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--teal)}
  .act{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button.go{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
  button.go[disabled]{background:var(--muted);cursor:not-allowed}
  button.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
  .lvl{border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
  .lvl .hd{background:var(--tint2);padding:9px 14px;font-weight:700;color:var(--navy);font-size:14px}
  .lvl .bd{padding:12px 14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .col h4{margin:0 0 5px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--teal)}
  .yours{background:var(--tint);border-radius:6px;padding:9px 11px;font-size:14px;white-space:pre-wrap;min-height:40px}
  .model{background:var(--gbg);border-radius:6px;padding:9px 11px;font-size:14px}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:8px;padding:8px 10px;border-radius:6px}
  .chk.g{background:var(--gbg)} .chk.y{background:var(--ybg)}
  .chk b{white-space:nowrap}
  .disc{background:var(--navy);color:#fff;border-radius:8px;padding:15px 17px;margin:18px 0}
  .disc h3{margin:0 0 8px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:#7FC4D6}
  .disc ul{margin:0;padding-left:18px} .disc li{margin-bottom:6px;font-size:14px}
  footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  @media(max-width:640px){ .bank ul{columns:1} .two{grid-template-columns:1fr} h1{font-size:21px} }
  @media print{.act,footer{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kick">DPHT 7441 &nbsp;|&nbsp; Module 5 &nbsp;|&nbsp; Sync Session 2</div>
  <h1>Write Ray's PT Diagnosis</h1>
  <div class="sub">Not the pathology — the diagnosis you would put in the note. Three levels, sorted from his findings.</div>
</header>
<main id="stage" aria-live="polite"></main>
<footer>Nothing is saved, submitted, or graded. This is practice for you.</footer>
</div>

<script>
// Findings deliberately unsorted. Each carries the ICF level it belongs to, for feedback only.
const FINDINGS = [
  { t:"Great toe extensor 4 out of 5 on the right", lvl:"bsf", code:"b7300 Power of isolated muscles and muscle groups" },
  { t:"Reduced light touch over the L5 dermatome", lvl:"bsf", code:"b265 Touch function" },
  { t:"Positive straight leg raise at 40 degrees", lvl:"bsf", code:"b789 Mobility of the meninges, peripheral nerves and adjacent tissues" },
  { t:"Symptoms centralize with repeated extension", lvl:"bsf", code:"b2803 Radiating pain in a dermatome, and how it responds to movement" },
  { t:"Pain 6 out of 10 at worst", lvl:"bsf", code:"b28013 Pain in back" },
  { t:"Fear-Avoidance Beliefs work subscale 22", lvl:"bsf", code:"b1602 Content of thought — the CPGs classify fear-avoidance as an impairment of body function" },
  { t:"Cannot sit or drive beyond about 20 minutes", lvl:"act", code:"d4153 Maintaining a sitting position; d475 Driving" },
  { t:"Cannot bend forward to load without leg symptoms", lvl:"act", code:"d4108 Bending; d430 Lifting and carrying objects" },
  { t:"Oswestry Disability Index 34%", lvl:"act", alt:"par", code:"The CPGs classify it as measuring activities AND participation — either placement is defensible" },
  { t:"Unable to complete a full delivery route of roughly 120 stops a week", lvl:"par", code:"d8451 Maintaining a job" }
];

const LEVELS = [
  { key:"bsf", name:"Body structure and function",
    hint:"The impairments. What is wrong with the body, stated so it can be measured.",
    model:"Right L5 radiculopathy with a directional preference for extension. Great toe extensor 4 out of 5, reduced light touch over the L5 dermatome, positive straight leg raise at 40 degrees, pain 6 out of 10 at worst. Elevated fear-avoidance beliefs, work subscale 22.",
    must:["l5","radicul","toe","4 out of 5","4/5","dermatome","straight leg","slr","extension","centraliz","directional","fear","fabq","belief"],
    mustLabel:"names the L5 involvement and at least one measured impairment" },
  { key:"act", name:"Activity limitation",
    hint:"What he cannot do, stated so you could re-measure it in two weeks.",
    model:"Cannot sit or drive beyond about 20 minutes. Cannot bend forward to load the van without provoking leg symptoms. Oswestry 34%.",
    must:["sit","driv","bend","lift","load","oswestry","odi","20 min"],
    mustLabel:"states a task he cannot do, not a symptom he has" },
  { key:"par", name:"Participation restriction",
    hint:"The life role affected, in his terms rather than generic ones.",
    model:"Unable to complete his full delivery route of roughly 120 stops a week.",
    must:["work","job","route","deliver","stops","driver","occupation","employ","shift"],
    mustLabel:"names his actual role, not a generic one" }
];

const stripLevels=t=>t.replace(/\b[LSTC]\d{1,2}(\s*[-–\/]\s*[LSTC]?\d{1,2})?\b/gi,' ');
const hasMeasure=t=>/\d/.test(stripLevels(t));
const shuffle=a=>{const o=a.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};
const SHOWN = shuffle(FINDINGS);
let answers={bsf:"",act:"",par:""};
const stage=document.getElementById('stage');

function renderWrite(){
  stage.innerHTML='';
  const t=document.createElement('div'); t.className='task';
  t.innerHTML='<p>Sort his findings into the three ICF levels, then write one line for each.</p>'+
    '<p class="small">Every line should carry a number. If you could not re-measure it in two weeks, it is not finished.</p>';
  stage.appendChild(t);

  const b=document.createElement('div'); b.className='bank';
  b.innerHTML='<h3>Ray’s findings — not in any order</h3>';
  const ul=document.createElement('ul');
  SHOWN.forEach(f=>{ const li=document.createElement('li'); li.textContent=f.t; ul.appendChild(li); });
  b.appendChild(ul); stage.appendChild(b);

  LEVELS.forEach(L=>{
    const lb=document.createElement('label'); lb.className='fl'; lb.textContent=L.name; stage.appendChild(lb);
    const h=document.createElement('p'); h.className='hint'; h.textContent=L.hint; stage.appendChild(h);
    const ta=document.createElement('textarea'); ta.value=answers[L.key];
    ta.oninput=()=>{ answers[L.key]=ta.value; go.disabled=!LEVELS.every(x=>answers[x.key].trim()); };
    stage.appendChild(ta);
  });

  const a=document.createElement('div'); a.className='act';
  const go=document.createElement('button'); go.className='go'; go.textContent='Compare with the model';
  go.disabled=!LEVELS.every(x=>answers[x.key].trim());
  go.onclick=()=>{ renderCompare(); window.scrollTo(0,0); };
  a.appendChild(go); stage.appendChild(a);
}

function renderCompare(){
  stage.innerHTML='';
  const h=document.createElement('h2'); h.textContent='Your diagnosis beside the model'; stage.appendChild(h);

  LEVELS.forEach(L=>{
    const mine=answers[L.key]||'', low=mine.toLowerCase();
    const box=document.createElement('div'); box.className='lvl';
    box.innerHTML='<div class="hd">'+L.name+'</div>';
    const bd=document.createElement('div'); bd.className='bd';
    const two=document.createElement('div'); two.className='two';
    const c1=document.createElement('div'); c1.className='col';
    c1.innerHTML='<h4>You wrote</h4>'; const y=document.createElement('div'); y.className='yours'; y.textContent=mine; c1.appendChild(y);
    const c2=document.createElement('div'); c2.className='col';
    c2.innerHTML='<h4>One defensible version</h4><div class="model">'+L.model+'</div>';
    two.appendChild(c1); two.appendChild(c2); bd.appendChild(two);

    const hasNum=hasMeasure(mine);
    const hasKey=L.must.some(k=>low.includes(k));
    const c=(ok,lab,good,bad)=>{ const d=document.createElement('div'); d.className='chk '+(ok?'g':'y');
      d.innerHTML='<b>'+(ok?'✓':'—')+'</b><span><b>'+lab+'.</b> '+(ok?good:bad)+'</span>'; return d; };
    bd.appendChild(c(hasNum,'Carries a number',
      'You can re-measure this.',
      'Nothing here can be re-measured. Add the value — a strength grade, a time, a score, a count.'));
    bd.appendChild(c(hasKey,'Right level',
      'It '+L.mustLabel+'.',
      'Check that this line '+L.mustLabel+'.'));

    // misplacement: which findings from other levels did they put here?
    const misplaced=FINDINGS.filter(f=>f.lvl!==L.key && f.alt!==L.key && f.t.split(' ').filter(w=>w.length>5).slice(0,3).every(w=>low.includes(w.toLowerCase())));
    if(misplaced.length){
      const m=document.createElement('div'); m.className='chk y';
      m.innerHTML='<b>—</b><span><b>Possibly the wrong level.</b> '+misplaced.map(f=>'“'+f.t+'”').join(', ')+
        ' belongs under '+misplaced.map(f=>LEVELS.find(l=>l.key===f.lvl).name.toLowerCase()).join(', ')+'.</span>';
      bd.appendChild(m);
    }
    box.appendChild(bd); stage.appendChild(box);
  });

  // the classic error: only a pathoanatomic label in body structure and function
  const bsf=(answers.bsf||'').trim();
  if(bsf && bsf.split(/\s+/).length<=4 && !hasMeasure(bsf)){
    const w=document.createElement('div'); w.className='chk y'; w.style.marginBottom='14px';
    w.innerHTML='<b>—</b><span><b>Your first line reads like a label.</b> “'+bsf+'” names a condition. The impairments are what you measured — and what you will re-test.</span>';
    stage.appendChild(w);
  }

  const sort=document.createElement('div'); sort.className='lvl';
  sort.innerHTML='<div class="hd">Where each finding belongs, with its ICF code</div>';
  const sb=document.createElement('div'); sb.className='bd';
  LEVELS.forEach(L=>{
    const hd=document.createElement('p'); hd.style.cssText='margin:10px 0 5px;font-size:14px;font-weight:700;color:var(--navy)';
    hd.textContent=L.name; sb.appendChild(hd);
    FINDINGS.filter(f=>f.lvl===L.key).forEach(f=>{
      const p=document.createElement('p'); p.style.cssText='margin:0 0 5px 12px;font-size:13.5px';
      p.innerHTML=f.t+' <span style="color:var(--muted);font-size:12.5px">— '+f.code+'</span>';
      sb.appendChild(p);
    });
  });
  const note=document.createElement('p'); note.style.cssText='margin:6px 0 0;font-size:13px;color:var(--muted)';
  note.textContent='Two findings trip people up. The fear-avoidance score is a BODY FUNCTION, not participation — the CPGs classify it as an impairment of thought content. It feels like participation because it is about work, which is exactly why it gets misfiled. The Oswestry measures activities and participation together, so either placement holds. And the directional preference is an impairment that happens to decide the treatment. Codes are from the 2012 low back pain CPG and the 2017 pelvic girdle pain CPG.';
  sb.appendChild(note); sort.appendChild(sb); stage.appendChild(sort);

  const d=document.createElement('div'); d.className='disc';
  d.innerHTML='<h3>We will talk this through together</h3><ul>'+
    '<li>Where did you put the fear-avoidance score? Most people put it under participation.</li>'+
    '<li>Read your activity line. Could someone re-measure it in two weeks without asking you what you meant?</li>'+
    '<li>If you read only your first line in a note, what would you not know about Ray?</li></ul>';
  stage.appendChild(d);

  const a=document.createElement('div'); a.className='act';
  const e=document.createElement('button'); e.className='go ghost'; e.textContent='Edit my diagnosis';
  e.onclick=()=>{ renderWrite(); window.scrollTo(0,0); }; a.appendChild(e);
  const p=document.createElement('button'); p.className='go ghost'; p.textContent='Print for your own notes';
  p.onclick=()=>window.print(); a.appendChild(p);
  stage.appendChild(a);
}

renderWrite();
</script>
</body>
</html>
