<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classification Sorter | DPHT 7441 Module 5</title>
<style>
  :root{
    --navy:#012D46; --teal:#00778B; --ink:#1F2933; --muted:#5A6570;
    --line:#D7DDE2; --tint:#F2F6F8; --tint2:#E8EFF2; --bg:#FFFFFF; --panel:#FFFFFF;
    --g:#1B7F4B; --gbg:#E6F2EA; --r:#B3261E; --rbg:#FBEAE8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
      --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
      --gbg:#14301F; --rbg:#37191A; --g:#6ED08F; --r:#F09189;
    }
  }
  :root[data-theme="dark"]{
    --navy:#8FC6DA; --teal:#4FB3C7; --ink:#E8EDF1; --muted:#9BA7B2;
    --line:#2A3946; --tint:#16222C; --tint2:#1B2A36; --bg:#0E171F; --panel:#13202A;
    --gbg:#14301F; --rbg:#37191A; --g:#6ED08F; --r:#F09189;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 70px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
  .kick{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--teal);text-transform:uppercase}
  h1{font-size:24px;color:var(--navy);margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .prog{display:flex;justify-content:space-between;align-items:center;margin:14px 0 16px;font-size:13px;color:var(--muted)}
  .dots{display:flex;gap:5px}
  .dot{width:22px;height:5px;border-radius:3px;background:var(--line)}
  .dot.g{background:var(--g)} .dot.r{background:var(--r)} .dot.on{background:var(--navy)}
  .vig{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px;font-size:16px}
  .q{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .opt{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 12px;
    cursor:pointer;font:inherit;color:inherit;font-weight:600;text-align:center}
  .opt:hover{border-color:var(--teal)}
  .opt[disabled]{cursor:default}
  .opt.right{background:var(--gbg);border-color:var(--g);color:var(--g)}
  .opt.wrong{background:var(--rbg);border-color:var(--r);color:var(--r)}
  .opt.dim{opacity:.4}
  .fb{border-radius:8px;padding:14px 16px;margin-top:14px;font-size:14px}
  .fb.g{background:var(--gbg)} .fb.r{background:var(--rbg)}
  .fb b{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
  .fb.g b{color:var(--g)} .fb.r b{color:var(--r)}
  .act{display:flex;gap:10px;margin-top:16px}
  button.go{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
  .final{background:var(--tint2);border-radius:8px;padding:18px;text-align:center;margin-bottom:16px}
  .final .n{font-size:38px;font-weight:700;color:var(--navy);display:block}
  .rev{padding:11px 13px;border-radius:7px;margin-bottom:7px;font-size:13.5px}
  .rev.g{background:var(--gbg)} .rev.r{background:var(--rbg)}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  @media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kick">DPHT 7441 &nbsp;|&nbsp; Module 5 &nbsp;|&nbsp; Retrieval Warm-Up</div>
  <h1>Classification Sorter</h1>
  <div class="sub">Eight short presentations. Sort each into a treatment-based subgroup. Feedback is immediate — about two minutes.</div>
</header>
<div class="prog"><span id="count">Case 1 of 8</span><div class="dots" id="dots"></div></div>
<main id="stage" aria-live="polite"></main>
<footer>Nothing is saved or submitted.</footer>
</div>

<script>
const SUBS = ["Manipulation","Specific exercise","Stabilization","Traction"];
const CASES = [
  { v:"27-year-old, low back pain for 6 days after shovelling. No symptoms below the knee. Fear-avoidance work score 9. L4–5 hypomobile and painful on spring testing. Hip internal rotation 44 degrees.",
    a:0, why:"Five of five on the manipulation rule — under 16 days, nothing distal to the knee, fear-avoidance under 19, a hypomobile segment, and a hip over 35 degrees. Four of five raises the chance of success with thrust from about 45% to 95%." },
  { v:"41-year-old, 5 weeks of back and right posterior thigh pain. Repeated extension in standing abolishes the thigh pain and it stays gone. Repeated flexion brings it back.",
    a:1, why:"One finding decides it: symptoms centralize with a tested direction and the change is maintained. Duration and the presence of thigh pain are irrelevant once a directional preference is demonstrated." },
  { v:"29-year-old, fourth episode in two years. Aberrant movement returning from flexion. Positive prone instability test. No leg symptoms. Reports a feeling of the back 'giving way'.",
    a:2, why:"Name what he has: younger age, aberrant movement on return from flexion, and a positive prone instability test, in a back that has given way four times in two years. The movement findings are what classify him — the recurrence is the reason he is in front of you." },
  { v:"52-year-old, 8 weeks of back pain with right calf symptoms and numbness over the dorsum of the foot. Great toe extension 4 out of 5. Repeated extension makes the calf symptoms worse and they stay worse.",
    a:3, why:"Signs of nerve root compression, symptoms distal to the knee, and symptoms that peripheralize with motion without centralizing. All three traction criteria are met. Note the evidence caution: mechanical traction carries a Grade D recommendation for chronic low back pain with leg pain. At eight weeks he is not yet chronic, so trial it and reassess rather than committing to a course." },
  { v:"35-year-old, 10 days of low back pain with right buttock symptoms after a long drive. Fear-avoidance work score 26. Segmental testing unremarkable. Hip internal rotation 30 degrees bilaterally. Repeated extension in standing abolishes the buttock pain and it stays gone.",
    a:1, why:"A trap. Recent onset looks like manipulation, but he fails three of its five criteria — fear-avoidance over 19, no hypomobile segment, and neither hip over 35 degrees. Meanwhile he centralizes with a tested direction, which is the single finding that defines specific exercise. When a patient fails one subgroup and meets another, the one he meets wins." },
  { v:"31-year-old, 8 days of low back pain after a heavy gym session. No symptoms below the knee. Fear-avoidance work score 11. Hip internal rotation 40 degrees. Painful arc on return from flexion. Spring testing reveals hypermobility at L4–5 with pain reproduction.",
    a:2, why:"The hardest item here. Four manipulation criteria are met — recent onset, nothing below the knee, fear-avoidance under 19, and a hip over 35 degrees — so it reads as a manipulation case on the surface. But the manipulation rule requires HYPOmobility on spring testing and he is HYPERmobile. Add the aberrant movement and it is stabilization. One segmental finding flips the whole answer." },
  { v:"45-year-old, 3 months of low back pain with referral into the right buttock. No aberrant movement, negative prone instability test. Repeated flexion in lying abolishes the buttock pain and it stays gone.",
    a:1, why:"The direction is flexion, not extension. The subgroup is defined by centralization with a tested direction, whichever direction that turns out to be, and centralization requires referred symptoms to retreat. Students default to extension because that is the example they were taught." },
  { v:"38-year-old, 2 weeks of back pain with intermittent buttock pain to the mid-thigh. No neurological signs. Repeated movements in every direction produce no lasting change. Segmental testing reveals a hypomobile painful L4–5. Fear-avoidance work score 12.",
    a:0, why:"No directional response, so specific exercise is out. No instability findings, so stabilization is out. No nerve root signs, so traction is out. Under 16 days, nothing below the knee, low fear-avoidance and a hypomobile segment leave manipulation — and buttock-to-mid-thigh pain is not 'distal to the knee'." }
];

let i=0, answers=[];
const stage=document.getElementById('stage'), dots=document.getElementById('dots'), count=document.getElementById('count');

function drawDots(){
  dots.innerHTML='';
  CASES.forEach((c,k)=>{
    const d=document.createElement('div');
    d.className='dot'+(answers[k]===undefined?(k===i?' on':''):(answers[k]?' g':' r'));
    dots.appendChild(d);
  });
}

function render(){
  drawDots();
  if(i>=CASES.length){ renderFinal(); return; }
  count.textContent='Case '+(i+1)+' of '+CASES.length;
  const c=CASES[i];
  stage.innerHTML='';
  const q=document.createElement('div'); q.className='q'; q.textContent='Which subgroup?'; stage.appendChild(q);
  const v=document.createElement('div'); v.className='vig'; v.textContent=c.v; stage.appendChild(v);
  const g=document.createElement('div'); g.className='grid';
  SUBS.forEach((s,k)=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=s;
    b.onclick=()=>answer(k,g,c); g.appendChild(b);
  });
  stage.appendChild(g);
}

function answer(k,g,c){
  const correct = k===c.a;
  answers[i]=correct;
  [...g.children].forEach((b,idx)=>{
    b.disabled=true;
    if(idx===c.a) b.classList.add('right');
    else if(idx===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const f=document.createElement('div'); f.className='fb '+(correct?'g':'r');
  f.innerHTML='<b>'+(correct?'Correct':'Not this one — '+SUBS[c.a])+'</b>'+c.why;
  stage.appendChild(f);
  const act=document.createElement('div'); act.className='act';
  const b=document.createElement('button'); b.className='go';
  b.textContent=(i===CASES.length-1)?'See score':'Next case';
  b.onclick=()=>{ i++; render(); window.scrollTo(0,0); };
  act.appendChild(b); stage.appendChild(act);
  drawDots();
}

function renderFinal(){
  count.textContent='Complete';
  const n=answers.filter(Boolean).length;
  stage.innerHTML='';
  const f=document.createElement('div'); f.className='final';
  f.innerHTML='<span class="n">'+n+' / '+CASES.length+'</span>'+
    (n>=7?'Strong. You are sorting on criteria rather than on pattern recall.'
        :n>=5?'Solid. Look at which ones you missed — they are usually the traps rather than the clear cases.'
        :'Worth revisiting the four subgroups before the session. The criteria matter more than the impression.');
  stage.appendChild(f);
  CASES.forEach((c,k)=>{
    const d=document.createElement('div'); d.className='rev '+(answers[k]?'g':'r');
    d.innerHTML='<b>'+(k+1)+'. '+SUBS[c.a]+'</b> — '+c.why;
    stage.appendChild(d);
  });
  const act=document.createElement('div'); act.className='act';
  const b=document.createElement('button'); b.className='go ghost'; b.textContent='Try again';
  b.onclick=()=>{ i=0; answers=[]; render(); window.scrollTo(0,0); };
  act.appendChild(b); stage.appendChild(act);
}

render();
</script>
</body>
</html>
